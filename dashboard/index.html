<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="color-scheme" content="light only">
<title>Antrenman Defteri</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
  /* Bento language, light only: warm grey ground, flat white tiles, one lime hero, indigo for data,
     Space Grotesk for big numbers. One hue per session type. Everything saves itself. */
  :root{
    --bg:#F2F2EE; --surface:#FFFFFF; --field:#F4F4F0; --track:#ECECE6; --line:#E6E5DF;
    --ink:#111318; --ink-2:#3F434A; --ink-3:#5F636B;
    --shadow:0 1px 2px rgba(17,19,24,.04);
    --lime:#C8EA21; --data:#3B3FE4; --data-2:#8F92F2; --data-3:#D9DAF8; --risk-bg:#FFD8CA; --risk-ink:#4A1B0C;
    --sg:"Space Grotesk","Inter",system-ui,sans-serif;
    --gym:#3B3FE4; --gym-2:#8F92F2; --gym-soft:#E6E7FC;
    --run:#E8590C; --run-2:#F59A62; --run-soft:#FDEBDD;
    --bike:#0E7C86; --bike-2:#5EB8BF; --bike-soft:#DDF1F2;
    --rest:#1F7A4D; --rest-2:#7CC49B; --rest-soft:#E2F2E8;
    --ok:#1F7A4D; --low:#3B3FE4; --high:#E8590C; --warn:#C2410C;
    --btn:#111318; --on-btn:#FFFFFF; --on-kind:#FFFFFF;
    color-scheme:light;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.4;
    -webkit-font-smoothing:antialiased;
    padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
    padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
  [hidden]{display:none!important}
  .wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
  section{margin-top:6px}
  h1,h2,h3{margin:0;letter-spacing:-.02em;text-wrap:balance}
  button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
  button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--bike);outline-offset:2px}
  .num{font-variant-numeric:tabular-nums}
  svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

  .k-gym,.k-full,.k-lower,.k-upper{--k:var(--gym);--k2:var(--gym-2);--ks:var(--gym-soft)}
  .k-run,.k-cardio{--k:var(--run);--k2:var(--run-2);--ks:var(--run-soft)}
  .k-bike{--k:var(--bike);--k2:var(--bike-2);--ks:var(--bike-soft)}
  .k-rest,.k-walk{--k:var(--rest);--k2:var(--rest-2);--ks:var(--rest-soft)}

  .card{background:var(--surface);border-radius:24px;box-shadow:var(--shadow);padding:18px}

  /* top */
  .top{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:54px}
  .navpill{display:flex;gap:4px;background:var(--surface);border-radius:999px;box-shadow:var(--shadow);padding:5px;margin-left:auto}
  .navpill button{width:44px;height:44px;border-radius:50%;border:0;background:none;cursor:pointer;display:grid;place-items:center}
  .navpill button:active{background:var(--field)}
  .todaybtn{border:0;background:var(--btn);color:var(--on-btn);border-radius:999px;padding:0 16px;height:44px;font-weight:600;font-size:14px;cursor:pointer}
  .cta{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .cta button{flex:1 1 0;white-space:nowrap;min-height:50px;border-radius:999px;border:0;background:var(--btn);color:var(--on-btn);font-weight:600;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 16px}
  .cta button.alt{background:var(--field);color:var(--ink)}

  /* bento dashboard */
  .dhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:0 4px 2px}
  .dhead>div{display:flex;flex-direction:column;gap:2px;min-width:0}
  .dhead small{font-size:13px;font-weight:500;color:var(--ink-3)}
  .dhead h1{font-family:var(--sg);font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.05}
  .face{flex:none;width:56px;height:56px}
  .face svg{width:56px;height:56px;display:block}
  .hero{border-radius:24px;padding:18px 20px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;gap:12px;background:var(--lime);color:#0E0E0E}
  .hero.risk{background:var(--risk-bg);color:var(--risk-ink)}
  .hero.wait{background:var(--surface);color:var(--ink)}
  .hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .hero .hk{display:block;font-size:13px;font-weight:600}
  .hero .hs{display:block;font-size:12px;color:#2E3300;margin-top:2px}
  .hero-top>div:first-child{min-width:0}
  .hero.risk .hs,.hero.wait .hs{color:inherit}
  .hero .hv{display:flex;align-items:baseline;gap:4px}
  .hero .hv b{font-family:var(--sg);font-size:clamp(44px,13vw,56px);font-weight:700;letter-spacing:-.03em;line-height:1}
  .hero .hv span{font-size:14px;font-weight:600}
  .hero h3{font-family:var(--sg);font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
  .hero svg.rg{width:100%;height:18px;display:block}
  .hf{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12px;color:#2E3300}
  .hero.risk .hf{color:inherit}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{font-size:12px;font-weight:600;background:#FFFFFF;border-radius:999px;padding:6px 10px}
  .jr{display:flex;flex-direction:column;gap:8px;padding:16px}
  .jtop{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .jtop b.k{display:block;font-size:13px;font-weight:600}
  .jtop small{display:block;font-size:12px;color:var(--ink-3);margin-top:2px}
  .jtop .w{font-family:var(--sg);font-size:26px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
  .jtop .w em{font-family:"Inter",sans-serif;font-style:normal;font-size:12px;font-weight:500;color:var(--ink-3);margin-left:3px}
  .jr svg{width:100%;height:auto;display:block}
  .duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .mini{min-height:140px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;padding:16px;min-width:0}
  .mini .k{font-size:13px;font-weight:600}
  .mini .big{font-family:var(--sg);font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1;white-space:nowrap}
  .mini .big em{font-family:"Inter",sans-serif;font-style:normal;font-size:13px;font-weight:500;color:var(--ink-3);margin-left:3px}
  .mini .sub{font-size:12px;color:var(--ink-3)}
  .stg{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px}
  .stg i{display:block;height:100%}
  .pbar{height:10px;border-radius:5px;background:#ECECF6;overflow:hidden}
  .pbar i{display:block;height:100%;background:var(--data);border-radius:5px}
  .hrvw{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px}
  .hrvw b{display:block;font-size:13px;font-weight:600}
  .hrvw small{display:block;font-size:12px;color:var(--ink-3);margin-top:4px}
  .hrvw svg{width:168px;height:56px;flex:none}
  .plancard{background:#111318;color:#FFFFFF;display:flex;flex-direction:column;gap:12px;padding:16px}
  .plancard .ph{display:flex;align-items:center;gap:12px}
  .plancard .ph .ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--k);color:#fff;flex:none}
  .plancard .ph div{flex:1;min-width:0}
  .plancard .ph b{display:block;font-size:17px;font-weight:700}
  .plancard .ph small{display:block;font-size:13px;color:#B5B8BF}
  .plancard p{margin:0;font-size:15px;line-height:1.45;color:#D9DBE0}
  .plancard .cta{margin-top:0}
  .plancard .cta button{background:var(--lime);color:#111318}
  .plancard .cta button.alt{background:#24272E;color:#FFFFFF}

  input,select,textarea{font:inherit;color:var(--ink);background:var(--field);border:0;border-radius:14px;padding:10px 12px;width:100%;min-width:0;min-height:46px;font-size:17px;font-weight:600}
  input::placeholder,textarea::placeholder{color:var(--ink-3);font-weight:400}
  .ts{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:600;color:var(--ink-3);min-height:22px;min-width:0}
  .ts .b{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none}
  .ts .b svg.i{width:12px;height:12px;stroke-width:3}
  .ts.ok{color:var(--ok)} .ts.ok .b{background:var(--ok)}
  .ts.low{color:var(--low)} .ts.low .b{background:var(--low)}
  .ts.high{color:var(--high)} .ts.high .b{background:var(--high)}
  .empty{color:var(--ink-3);font-size:15px}
  .banner{border-radius:22px;padding:14px 16px;font-size:15px;background:var(--surface);box-shadow:var(--shadow);color:var(--warn);font-weight:500}

  /* ---------- lower half: same bento language ---------- */
  .lbl,.notecard .k{font-size:13px;font-weight:600;color:var(--ink)}
  .lr{font-size:12px;color:var(--ink-3);text-align:right}
  .chd{display:flex;justify-content:space-between;align-items:baseline;gap:4px 10px;flex-wrap:wrap}
  .glabel{font-family:var(--sg);font-size:20px;font-weight:700;padding:16px 4px 0}
  .big{font-family:var(--sg);font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1;white-space:nowrap}
  .big em{font-family:"Inter",sans-serif;font-style:normal;font-size:13px;font-weight:500;color:var(--ink-3);margin-left:3px;letter-spacing:0}
  .mempty{font-size:13px;color:var(--ink-3);line-height:1.45}
  .foot{font-size:12px;color:var(--ink-3);line-height:1.45}
  .ico.sm{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--k);color:#FFFFFF;flex:none}
  .ico.sm svg.i{width:18px;height:18px}
  .dch{font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 8px;white-space:nowrap;flex:none;background:#FFFFFF;color:var(--ink-2)}
  .dch.up{background:var(--lime);color:#111318}
  .dch.dn{background:var(--run-soft);color:var(--warn)}

  /* check-in tiles */
  .ci{cursor:text}
  .civ{display:flex;align-items:baseline;gap:3px;min-width:0}
  .civ input{background:none;padding:0;min-height:0;border-radius:6px;font-family:var(--sg);font-size:34px;font-weight:700;letter-spacing:-.02em;flex:none;max-width:100%}
  .civ input::placeholder{color:#C9CBD1;font-weight:700}
  .civ em{font-style:normal;font-size:13px;font-weight:500;color:var(--ink-3)}
  .ci .ts{font-size:12px;min-height:18px;line-height:1.3}
  .ci .ts .b{width:16px;height:16px}
  .ci.need{box-shadow:inset 0 0 0 2px var(--lime)}

  /* strength session */
  #gymBox{display:flex;flex-direction:column;gap:10px}
  #gymBox:empty{display:none}
  .gym{display:flex;flex-direction:column;gap:12px;padding:16px;scroll-margin-top:12px}
  .gh{display:flex;align-items:center;gap:12px}
  .gh .ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--k);color:#FFFFFF;flex:none}
  .gh>div{flex:1;min-width:0}
  .gh b{display:block;font-family:var(--sg);font-size:19px;font-weight:700;letter-spacing:-.02em}
  .gh small{display:block;font-size:12px;color:var(--ink-3)}
  .ghost{border:0;background:var(--field);color:var(--ink);font-size:13px;font-weight:600;border-radius:999px;min-height:36px;padding:0 14px;cursor:pointer;flex:none}
  .ghost.on{background:#111318;color:#FFFFFF}
  .exg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .ext{background:var(--field);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
  .et{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;min-height:34px}
  .et b.en{font-size:13px;font-weight:600;line-height:1.3;min-width:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .et input.en{background:#FFFFFF;min-height:34px;padding:6px 8px;font-size:13px;border-radius:10px;flex:1}
  .exdel{border:0;background:#FFFFFF;color:var(--ink-2);width:34px;height:34px;border-radius:10px;font-size:18px;line-height:1;cursor:pointer;flex:none}
  .ev{display:flex;align-items:baseline;gap:3px;cursor:text;min-width:0}
  .ev input{background:none;padding:0;min-height:0;border-radius:6px;font-family:var(--sg);font-size:30px;font-weight:700;letter-spacing:-.02em;flex:none;max-width:100%}
  .ev input::placeholder{color:#C9CBD1;font-weight:700}
  .ev em{font-style:normal;font-size:12px;font-weight:500;color:var(--ink-3)}
  .el{font-size:12px;color:var(--ink-3);min-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .es{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .step{border:0;background:#FFFFFF;color:var(--ink);border-radius:12px;height:44px;font-size:22px;font-weight:600;cursor:pointer;padding:0}
  .step:active{transform:scale(.95)}
  .ext.on{background:#ECEEFD}
  .ext.add{border:2px dashed #C9CBD1;background:none;color:var(--ink-2);font-weight:600;font-size:14px;align-items:center;justify-content:center;gap:6px;min-height:150px;cursor:pointer;flex-direction:row}
  .gnote{font-size:12px;color:var(--ink-3)}
  .gfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;color:var(--ink-3)}
  .danger{border:0;background:var(--run-soft);color:var(--warn);font-weight:600;font-size:13px;border-radius:999px;min-height:36px;padding:0 14px;cursor:pointer;flex:none}

  /* movement: Fitbit workouts + hand-logged cardio */
  .move{display:flex;flex-direction:column;gap:8px;padding:16px}
  .fw{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 10px;border-radius:18px;background:var(--field)}
  .fw>div{flex:1;min-width:0}
  .fw b{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:600}
  .fw small{display:block;font-size:12px;color:var(--ink-3)}
  .src{font-size:10.5px;font-weight:600;color:var(--ink-3);background:#FFFFFF;border-radius:999px;padding:2px 7px}
  .fv{font-family:var(--sg);font-size:20px;font-weight:700;white-space:nowrap}
  .fv em{font-family:"Inter",sans-serif;font-style:normal;font-size:11px;font-weight:500;color:var(--ink-3);margin-left:2px}
  .ms{background:var(--field);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:10px}
  .msh{display:flex;align-items:center;gap:12px}
  .msh>div{flex:1;min-width:0}
  .msh b{display:block;font-size:15px;font-weight:600}
  .msh small{display:block;font-size:12px;color:var(--ink-3)}
  .x{border:0;background:#FFFFFF;color:var(--ink-2);font-size:13px;font-weight:600;cursor:pointer;border-radius:999px;padding:0 14px;min-height:36px;flex:none}
  .fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
  .fields.two{grid-template-columns:repeat(2,minmax(0,1fr))}
  .fld{background:#FFFFFF;border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;cursor:text;min-width:0}
  .fld span{font-size:11.5px;font-weight:600;color:var(--ink-3);white-space:nowrap}
  .fld input{background:none;padding:0;min-height:28px;border-radius:4px;font-family:var(--sg);font-size:20px;font-weight:700}
  .fld input::placeholder{color:#C9CBD1}
  .seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .seg button{border:0;background:#FFFFFF;border-radius:10px;min-height:36px;font-weight:600;font-size:13px;cursor:pointer}
  .seg button[aria-pressed="true"]{background:#111318;color:#FFFFFF}
  .adds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;padding-top:4px}
  .adds>span{grid-column:1/-1;font-size:12px;color:var(--ink-3)}
  .addc{border:0;background:var(--field);border-radius:14px;min-height:42px;padding:0 10px;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;min-width:0}
  @media (min-width:420px){.adds{grid-template-columns:repeat(4,minmax(0,1fr))}}
  .addc::before{content:"";width:8px;height:8px;border-radius:3px;background:var(--k)}

  /* note */
  .notecard{display:flex;flex-direction:column;gap:8px;padding:16px}
  .notecard textarea{min-height:96px;resize:none;font-weight:500;font-size:16px;line-height:1.5;overflow:hidden;background:var(--field);border-radius:16px}

  /* posture */
  .pcard{display:flex;flex-direction:column;gap:12px;padding:16px}
  .ptop{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .ptop>div{display:flex;flex-direction:column;gap:6px;min-width:0}
  .ptop small{font-size:12px;color:var(--ink-3)}
  .pnow{border:0;background:var(--lime);color:#111318;border-radius:999px;min-height:46px;padding:0 16px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;flex:none}
  .pslots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .pslot{background:var(--field);border-radius:16px;height:52px;display:flex;align-items:center;justify-content:center;gap:5px;font-size:13px;font-weight:600;color:var(--ink-3)}
  .pslot.on{background:var(--lime);color:#111318;font-family:var(--sg);font-size:15px}
  .pslot svg.i{width:16px;height:16px;stroke-width:3}
  .pfoot{display:flex;gap:6px 16px;font-size:12px;color:var(--ink-3);flex-wrap:wrap}
  .pfoot b{font-family:var(--sg);font-size:15px;color:var(--ink);margin:0 1px}
  .pfoot .lie b{color:var(--warn)}

  /* trends */
  .trend,.sleepw,.strc,.cal{display:flex;flex-direction:column;gap:10px;padding:16px}
  .tstat{display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap}
  .tstat .tsub{font-size:12px;color:var(--ink-3);line-height:1.45}
  .tstat .tsub b{color:var(--ink);font-weight:600}
  .chart{width:100%;height:auto;display:block}
  .sleepw svg{width:100%;height:auto;display:block}
  .legend{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12px;color:var(--ink-3)}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  .legend i.ol{box-shadow:inset 0 0 0 2px var(--ink-3)}
  .legend i.dash{width:14px;height:2px;border-radius:0;vertical-align:3px;background:repeating-linear-gradient(90deg,#111318 0 4px,transparent 4px 7px)}
  .srow{display:grid;grid-template-columns:minmax(0,1fr) 72px auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
  .srow b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .srow small{font-size:12px;color:var(--ink-3)}
  .srow svg{width:72px;height:30px;overflow:visible}
  .srow .sv{display:flex;flex-direction:column;align-items:flex-end;gap:4px;min-width:64px}
  .srow .sv strong{font-family:var(--sg);font-size:20px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
  .srow .sv strong em{font-family:"Inter",sans-serif;font-style:normal;font-size:12px;font-weight:500;color:var(--ink-3);margin-left:2px}
  .srow .dch{background:var(--field)}
  .srow .dch.up{background:var(--lime)}
  .srow .dch.dn{background:var(--run-soft)}

  /* findings: what the pipeline's statistics say */
  .find{display:flex;flex-direction:column;gap:10px;padding:16px}
  .find h3{font-family:var(--sg);font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
  .find .lead{font-size:13px;color:var(--ink-2);line-height:1.5}
  .find .lead b{color:var(--ink);font-weight:600}
  .frow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 0 2px;border-top:1px solid var(--line)}
  .frow b{display:block;font-size:15px;font-weight:600}
  .frow small{display:block;font-size:12px;color:var(--ink-3);line-height:1.4}
  .frow .fr{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
  .frow .fr strong{font-family:var(--sg);font-size:20px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
  .frow .fr strong em{font-family:"Inter",sans-serif;font-style:normal;font-size:12px;font-weight:500;color:var(--ink-3);margin-left:2px}
  .frow .dch{background:var(--field)}
  .frow .dch.up{background:var(--lime)}
  .frow .dch.mid{background:var(--data-3);color:#1B1D8C}
  .fbar{grid-column:1/-1;position:relative;height:6px;border-radius:3px;background:var(--field);margin-top:4px}
  .fbar::after{content:"";position:absolute;left:50%;top:-3px;width:2px;height:12px;margin-left:-1px;border-radius:1px;background:var(--ink-3)}
  .fbar i{position:absolute;top:0;height:6px;border-radius:3px;background:#B9BBC2}
  .fbar i.s{background:var(--data)}
  .falert{background:var(--field);border-radius:16px;padding:12px;font-size:13px;color:var(--ink-2);line-height:1.5}
  .falert b{color:var(--ink);font-weight:600}

  /* calendar */
  .cgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr)) 36px;gap:5px 4px;align-items:center}
  .cgrid .dh{font-size:11px;font-weight:600;color:var(--ink-3);text-align:center}
  .cd{position:relative;border:0;aspect-ratio:1;min-height:32px;border-radius:10px;background:none;font-family:var(--sg);font-size:14px;font-weight:700;color:var(--ink-2);cursor:pointer;display:grid;place-items:center;padding:0}
  .cd.miss{background:var(--field);color:var(--ink-3)}
  .cd.plan{box-shadow:inset 0 0 0 2px var(--k);color:var(--ink)}
  .cd.d-gym{background:var(--gym);color:#FFFFFF}
  .cd.d-run{background:var(--run);color:#FFFFFF}
  .cd.d-bike{background:var(--bike);color:#FFFFFF}
  .cd.d-walk{background:var(--rest-soft);color:var(--rest)}
  .cd.pre{opacity:.35}
  .cd.today::after{content:"";position:absolute;bottom:3px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:2px;background:currentColor}
  .cd.sel{outline:2.5px solid #111318;outline-offset:1px}
  .cs{font-size:12px;font-weight:600;color:var(--ink-3);text-align:center;border-radius:8px;padding:3px 0}
  .cs.hit{color:#111318;background:var(--lime)}

  /* how it works */
  .how{padding:0}
  .how summary{list-style:none;cursor:pointer;padding:16px;font-size:13px;font-weight:600;display:flex;justify-content:space-between;align-items:center;min-height:52px}
  .how summary::-webkit-details-marker{display:none}
  .how summary::after{content:"+";font-family:var(--sg);font-size:22px;font-weight:600;line-height:1}
  .how[open] summary::after{content:"−"}
  .how ul{margin:0;padding:0 18px 18px 34px;font-size:13px;color:var(--ink-2);line-height:1.5;display:flex;flex-direction:column;gap:8px}

  /* save toast: shows only while saving, after a save, or when a save failed */
  .savepill{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:10;display:flex;align-items:center;gap:8px;
    background:#111318;color:#FFFFFF;border-radius:999px;padding:0 16px 0 12px;height:40px;font-size:13px;font-weight:600;border:0;box-shadow:0 8px 24px rgba(17,19,24,.18);
    cursor:default;transition:opacity .3s,transform .3s;white-space:nowrap}
  .savepill i{width:8px;height:8px;border-radius:50%;background:var(--lime)}
  .savepill.saving i{background:#F59A62;animation:blink .8s steps(2) infinite}
  .savepill.bad{background:var(--risk-bg);color:var(--risk-ink);cursor:pointer}
  .savepill.bad i{background:var(--warn)}
  .savepill.idle{opacity:0;pointer-events:none;transform:translate(-50%,8px)}

  /* posture alarm overlay */
  .pa{position:fixed;inset:0;z-index:50;display:flex;color:#fff;overflow-y:auto;isolation:isolate;background:#C8102E;transition:background .5s;
    padding:calc(22px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
  .pa::before{content:"";position:fixed;inset:-25%;z-index:-1;pointer-events:none}
  .pa.red::before{background:radial-gradient(circle at 50% 38%,#FF5A67 0%,#D3132F 42%,#6E0016 100%);animation:paPulse 1.4s ease-in-out infinite}
  .pa.liar::before{background:radial-gradient(circle at 50% 38%,#FF2D3D 0%,#A3001B 45%,#2A0007 100%);animation:paPulse .8s ease-in-out infinite}
  .pa.dark{background:#09090D}
  .pa.dark::before{background:radial-gradient(circle at 50% 30%,#2B2B3A 0%,#09090D 60%)}
  .pa.amber{background:#B45309}
  .pa.amber::before{background:radial-gradient(circle at 50% 35%,#F59E0B 0%,#B45309 55%,#5A2A04 100%)}
  .pa.green{background:#15803D}
  .pa.green::before{background:radial-gradient(circle at 50% 35%,#4ADE80 0%,#16A34A 45%,#0B4D25 100%)}
  .pa.guide{background:#17153F}
  .pa.guide.holding{background:#0E4E33}
  @keyframes paPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.72;transform:scale(1.08)}}
  @keyframes blink{50%{opacity:.35}}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
  .pa-in{max-width:520px;width:100%;margin:auto;display:flex;flex-direction:column;gap:16px;text-align:center}
  .pa .badge{align-self:center;display:inline-flex;gap:8px;align-items:center;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.55);border-radius:999px;padding:8px 16px;font-weight:800;letter-spacing:.12em;font-size:13px;text-transform:uppercase}
  .pa.red .badge,.pa.liar .badge{animation:blink 1s steps(2) infinite}
  .pa .badge svg.i{width:18px;height:18px;stroke-width:2.5}
  .pa h1{font-size:clamp(42px,13vw,84px);font-weight:900;line-height:1.02;padding-top:.06em;letter-spacing:-.045em;text-transform:uppercase;margin:0;text-wrap:balance}
  .pa.liar h1{animation:shake .5s ease-in-out 2}
  .pa.amber h1{font-size:clamp(36px,10.5vw,68px)}
  .pa button:focus-visible{outline:3px solid #fff;outline-offset:3px}
  .pa .sub{font-size:18px;font-weight:500;line-height:1.42;margin:0;opacity:.95;text-wrap:pretty}
  .pa .meta{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
  .pa .meta span{background:rgba(0,0,0,.22);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600}
  .pa .acts{display:flex;flex-direction:column;gap:10px;margin-top:6px}
  .pa .btn-main{min-height:72px;border-radius:999px;border:0;background:#fff;color:#B00E28;font-size:21px;font-weight:800;cursor:pointer;box-shadow:0 14px 34px rgba(0,0,0,.28)}
  .pa.amber .btn-main{color:#92400E} .pa.green .btn-main{color:#15803D}
  .pa .btn-sec{min-height:58px;border-radius:999px;border:2px solid rgba(255,255,255,.7);background:transparent;color:#fff;font-size:17px;font-weight:700;cursor:pointer}
  .pa .btn-lie{min-height:58px;border-radius:999px;border:2px solid #FF5A5F;background:rgba(255,90,95,.08);color:#FF8F93;font-size:17px;font-weight:800;cursor:pointer}
  .pa .hold{position:relative;overflow:hidden;min-height:76px;border-radius:999px;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:20px;font-weight:800;cursor:pointer;
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;box-shadow:inset 0 0 0 2px rgba(255,255,255,.5)}
  .pa .hold .fill{position:absolute;inset:0;width:0;background:#22C55E;transition:width .15s}
  .pa .hold.on .fill{width:100%;transition:width 1.6s linear}
  .pa .hold .lbl{position:relative}
  .pa .hold small{display:block;font-size:12px;font-weight:600;opacity:.8;letter-spacing:.04em}
  .pa .bigcheck{width:min(30vw,130px);height:min(30vw,130px);border-radius:50%;background:#fff;color:#16A34A;display:grid;place-items:center;align-self:center;box-shadow:0 14px 34px rgba(0,0,0,.25)}
  .pa .bigcheck svg.i{width:58%;height:58%;stroke-width:3}

  .head{width:min(44vw,180px);height:auto;align-self:center;color:#fff;overflow:visible}
  .head .nk,.head .hd{transform-box:view-box;transition:transform .9s cubic-bezier(.4,0,.2,1)}
  .head .nk{transform-origin:100px 170px}
  .head.fwd .nk{transform:rotate(26deg)}
  .head.fwd .hd{transform:translate(25px,6px)}
  .head.loop .nk{animation:nkLoop 3s ease-in-out infinite}
  .head.loop .hd{animation:hdLoop 3s ease-in-out infinite}
  @keyframes nkLoop{0%,20%,100%{transform:rotate(26deg)}46%,80%{transform:rotate(0)}}
  @keyframes hdLoop{0%,20%,100%{transform:translate(25px,6px)}46%,80%{transform:translate(0,0)}}

  .gbar{height:6px;border-radius:999px;background:rgba(255,255,255,.18);overflow:hidden}
  .gbar i{display:block;height:100%;width:0;background:#fff;border-radius:inherit}
  .gring{position:relative;width:min(56vw,230px);aspect-ratio:1;align-self:center}
  .gring svg{width:100%;height:100%;transform:rotate(-90deg)}
  .gring .gnum{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(64px,20vw,96px);font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
  .gwrap{display:grid;grid-template-columns:1fr;gap:6px;justify-items:center}

  @media (prefers-reduced-motion: reduce){*{transition:none!important;scroll-behavior:auto!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <button class="todaybtn" id="toToday" hidden>Bugüne dön</button>
    <div class="navpill">
      <button id="prev" aria-label="Önceki gün"></button>
      <button id="next" aria-label="Sonraki gün"></button>
    </div>
  </div>
  <div class="dhead">
    <div>
      <small><span id="dateLabel">—</span><span id="fitTime"></span></small>
      <h1 id="headline">Hazırsın.</h1>
      <span id="dowLabel" hidden></span>
    </div>
    <div class="face" id="face" role="img" aria-label="Durum yüzü"></div>
  </div>

  <div class="hero wait" id="hero"><div><span class="hk">Toparlanma</span><span class="hs">Fitbit verisi yükleniyor…</span></div></div>

  <div class="card jr" id="journey"></div>

  <div class="duo">
    <div class="card mini" id="sleepCard"></div>
    <div class="card mini" id="stepsCard"></div>
  </div>

  <div class="card hrvw" id="hrvWeek"></div>

  <div class="card plancard" id="planPill">
    <div class="ph"><span class="ico" id="planIco"></span><div><b id="planTitle">—</b><small id="planSub">—</small></div></div>
    <p id="planText">—</p>
    <div class="cta" id="cta"></div>
  </div>

  <div class="banner" id="dbBanner" hidden></div>

  <div id="gymBox"></div>

  <div class="duo">
    <label class="card mini ci" id="ciW" for="weight"><span class="k">Sabah tartı</span><span class="civ"><input id="weight" class="num" type="text" inputmode="decimal" autocomplete="off" placeholder="—"><em>kg</em></span><span class="ts" id="tsW"></span></label>
    <label class="card mini ci" for="waist"><span class="k">Bel · haftada bir</span><span class="civ"><input id="waist" class="num" type="text" inputmode="decimal" autocomplete="off" placeholder="—"><em>cm</em></span><span class="ts" id="tsB"></span></label>
  </div>

  <div class="card move" id="move"></div>

  <div class="card notecard">
    <label for="notes" class="k">Not</label>
    <textarea id="notes" rows="3" placeholder="Ne yedin, nasıl hissettin, uyku…"></textarea>
  </div>

  <div class="card pcard" id="pCard"></div>

  <h2 class="glabel">Gidişat</h2>
  <div class="card trend" id="trend"></div>
  <div class="card sleepw" id="sleepWeek"></div>
  <div class="card find" id="findings"></div>
  <div class="card strc" id="strength"></div>

  <h2 class="glabel">Takvim</h2>
  <div class="card cal" id="cal"></div>

  <details class="card how"><summary>Bu sayfa nasıl çalışır</summary><ul id="howBody"></ul></details>
</div>

<div class="pa" id="pa" role="alertdialog" aria-modal="true" aria-label="Postür alarmı" hidden></div>
<button class="savepill idle" id="savePill" type="button"><i></i><span id="saveTxt"></span></button>

<script>
(function(){
  const DOW = ["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"];
  const DOW_S = ["Paz","Pzt","Sal","Çar","Per","Cum","Cmt"];
  const MON = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];

  // Personal targets and the exercise list live in the database (meta/config), not in the code:
  // the same page serves any person, and the public demo runs it against synthetic data.
  // These are only the fallbacks until that document arrives.
  const WEEK_TARGET = 5;
  let GOAL = 80, START_W = 90, MILESTONE = 85, DIET_START = null, cfgSeen = false;
  let GYM_EX = ["Bench","Pull","Face pull","Triceps","Biceps","Leg press"];
  // machine stacks move in bigger jumps than dumbbells
  let STEP = {"pull":10, "leg press":10, "face pull":5};
  const stepFor = name => STEP[norm(name)] || 2.5;
  const gymText = () => `${GYM_EX.length > 1 ? GYM_EX.slice(0,-1).join(", ") + " ve " + GYM_EX[GYM_EX.length-1] : GYM_EX.join("")}. Geçen seferin kilosu her hareketin altında; temiz çıktıysa + ile bir adım artır.`;
  const GYM_P = {kind:"gym", short:"Ağırlık", title:"Ağırlık günü", text:gymText()};
  // Turkish dative after a number: 80'e, 82'ye, 90'a
  const DAT1 = ["","'e","'ye","'e","'e","'e","'ya","'ye","'e","'a"], DAT10 = ["'e","'a","'ye","'a","'a","'ye","'a","'e","'e","'a"];
  const dat = n => { const r = Math.round(n); return fmt(n) + (r % 10 ? DAT1[r % 10] : DAT10[Math.floor(r/10) % 10]); };
  function applyConfig(v){
    v = v && typeof v==="object" ? v : {};
    const n = (x, d) => typeof x==="number" && isFinite(x) && x > 0 ? x : d;
    GOAL = n(v.goal, GOAL); START_W = n(v.startW, START_W); MILESTONE = n(v.milestone, MILESTONE);
    if (START_W <= GOAL) START_W = GOAL + 10;
    if (!(MILESTONE < START_W && MILESTONE > GOAL)) MILESTONE = (START_W + GOAL) / 2;
    if (typeof v.dietStart==="string" && /^\d{4}-\d{2}-\d{2}$/.test(v.dietStart)) DIET_START = v.dietStart;
    if (Array.isArray(v.gymEx) && v.gymEx.length){ const ex = v.gymEx.filter(x => typeof x==="string" && x.trim()).map(x => x.trim()).slice(0, 12); if (ex.length) GYM_EX = ex; }
    if (v.steps && typeof v.steps==="object"){ const st = {}; Object.keys(v.steps).forEach(k => { const x = v.steps[k]; if (typeof x==="number" && x > 0) st[norm(k)] = x; }); STEP = st; }
    GYM_P.text = gymText();
    cfgSeen = true;
  }
  const CAR_P = {kind:"cardio", short:"Kardiyo", title:"Kardiyo", text:"Bisiklet ya da koşu, sen seç. Konuşabileceğin ama şarkı söyleyemeyeceğin tempo: bisiklette nabız 120–135, koşuda 150 altı. 40 dakika ve üstünü hedefle; öncesinde bir muz."};
  const RST_P = {kind:"rest", short:"Dinlen", title:"Dinlenme", text:"Bugün antrenman yok. Proteini tamamla, postür turlarını kaçırma. Yürüyüş yaptıysan ekle."};
  const PLAN = {0:RST_P, 1:CAR_P, 2:GYM_P, 3:CAR_P, 4:GYM_P, 5:RST_P, 6:GYM_P};
  const KIND_LABEL = {gym:"Ağırlık", full:"Full body", lower:"Alt gün", upper:"Üst gün", run:"Koşu", bike:"Bisiklet", walk:"Yürüyüş"};
  const isStrength = k => k==="gym"||k==="full"||k==="lower"||k==="upper";

  const P = {
    gym:'<path d="M6.5 7v10M3.5 9.5v5M17.5 7v10M20.5 9.5v5M6.5 12h11"/>',
    run:'<circle cx="14.5" cy="4.5" r="1.8"/><path d="M7 21l3.2-5.5 3 2.2V21M5.5 11.5l3-2.5 4 .8 2.2 3 3.3 1M10.2 15.5l2-6"/>',
    bike:'<circle cx="6" cy="16" r="3.6"/><circle cx="18" cy="16" r="3.6"/><path d="M6 16l4.5-7.5H15l3 7.5M10.5 8.5l3.5 7.5M9 6h3"/>',
    walk:'<circle cx="12.5" cy="4.5" r="1.8"/><path d="M9.5 21l2.3-6 2.4 2.3V21M8.5 11l3.3-2.6 2.7 2.9 2.5 1.2M11.8 15l.5-6.5"/>',
    rest:'<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',
    scale:'<rect x="3.5" y="3.5" width="17" height="17" rx="5"/><path d="M8.5 10a4.5 4.5 0 0 1 7 0M12 10l1.4-2"/>',
    ruler:'<rect x="2.5" y="8" width="19" height="8" rx="2.5"/><path d="M7 8v3M11 8v4M15 8v3M19 8v2"/>',
    note:'<path d="M6 3.5h8.5l4 4V20.5H6zM9.5 12.5h6M9.5 16.5h4"/>',
    bolt:'<path d="M13 2.5L4.5 13.5h6.5l-1 8 8.5-11h-6.5z"/>',
    flame:'<path d="M12 21.5c-3.9 0-6.5-2.6-6.5-6.2 0-3.3 2.3-5.2 3.6-7.6.5 1.7 1.4 2.8 2.6 3.5-.2-3.4 1-6.2 3.3-8.2.3 3.3 1.6 5.3 2.9 7.1 1 1.4 1.6 3 1.6 5.2 0 3.6-3.6 6.2-7.5 6.2z"/>',
    neck:'<circle cx="12" cy="7" r="4"/><path d="M12 11v5M7 21c1.2-2.6 3-4 5-4s3.8 1.4 5 4M3 7h3"/>',
    l:'<path d="M15 5l-7 7 7 7"/>', r:'<path d="M9 5l7 7-7 7"/>',
    plus:'<path d="M12 5v14M5 12h14"/>',
    up:'<path d="M12 18V6M6.5 11.5L12 6l5.5 5.5"/>', down:'<path d="M12 6v12M6.5 12.5L12 18l5.5-5.5"/>',
    check:'<path d="M5.5 12.5l4 4 9-9"/>'
  };
  const ico = n => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${P[n]||P.gym}</svg>`;
  const kindIco = k => ico(isStrength(k) ? "gym" : k==="cardio" ? "run" : k);

  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
  const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return iso(d); };
  const daysBetween = (a,b) => Math.round((parse(b)-parse(a))/86400000);
  const num = v => { const n = parseFloat(String(v ?? "").replace(",", ".")); return isFinite(n) ? n : null; };
  const fmt = n => n==null || n==="" ? "" : String(Math.round(Number(n)*100)/100);
  const norm = s => String(s||"").trim().toLocaleLowerCase("tr");
  const shortDate = s => { const d = parse(s); return `${d.getDate()} ${MON[d.getMonth()].slice(0,3)}`; };
  const sign = v => (v>0?"+":v<0?"−":"±") + fmt(Math.abs(v));

  document.querySelectorAll("[data-icon]").forEach(el => el.insertAdjacentHTML("afterbegin", ico(el.dataset.icon)));
  $("prev").innerHTML = ico("l"); $("next").innerHTML = ico("r");

  let TODAY = iso(new Date());
  let cur = TODAY, day = emptyDay(cur), dirty = false, db = null, unsubDay = null, saveT = null, lastWrite = null, pendingSess = false;
  const hist = new Map();
  const editing = new Set();   // strength sessions whose exercise names are being edited

  function emptyDay(date){ return {date, weight:null, waist:null, notes:"", sessions:[], legacy:{}}; }

  // last logged weight on this exercise before `date`
  function lastFor(name, date){
    const key = norm(name); if (!key) return null;
    const dates = [...hist.keys()].filter(d => d < date).sort().reverse();
    for (const d of dates){
      for (const s of (hist.get(d).sessions||[])){
        if (!isStrength(s.kind)) continue;
        const e = (s.ex||[]).find(x => norm(x.name)===key && x.kg!=null);
        if (e) return {date:d, kg:Number(e.kg)};
      }
    }
    return null;
  }

  function newSession(kind){
    if (isStrength(kind)) return {kind:"gym", ex: GYM_EX.map(n => { const l = lastFor(n, cur); return {name:n, kg: l ? fmt(l.kg) : "", sets:"", reps:""}; })};
    if (kind==="run") return {kind, min:"", km:"", hr:""};
    if (kind==="bike") return {kind, type:"Z2", min:"", hr:""};
    return {kind:"walk", min:"", km:""};
  }

  const sessionsOf = ds => ds===cur ? day.sessions : ((hist.get(ds)||{}).sessions||[]);
  const weights = () => [...hist.values()].filter(d => d.weight!=null).sort((a,b)=>a.date.localeCompare(b.date));
  function avg7(upTo){

  // least-squares line through the last 3 weeks of weigh-ins: kg per day, and where the line sits today
  function trendFit(ref){

    const mx = mAvg(xs), my = mAvg(ys), sxx = xs.reduce((a,x) => a+(x-mx)**2, 0);

  function renderTrend(){

    const ref = all[all.length-1].date, a7 = avg7(ref), tf = trendFit(ref);

    else {

    let lo = Math.floor(Math.min(...K.map(o => o.s))/60)*60, hi = Math.ceil(Math.max(...K.map(o => o.e))/60)*60;
    if (hi - lo < 480) hi = Math.min(1440, lo + 480);
    const X0 = 34, X1 = 276, X = t => X0 + (t-lo)/(hi-lo)*(X1-X0), RH = 24, H = 7*RH + 18, SG = "Space Grotesk, Inter, sans-serif", FF = "Inter, sans-serif";
    const clock = t => { const m = Math.round((18*60 + t) % 1440); return `${String(Math.floor(m/60)).padStart(2,"0")}:${String(m%60).padStart(2,"0")}`; };
    let g = "";
    const stp = hi - lo > 720 ? 180 : 120;
    for (let t = Math.ceil(lo/stp)*stp; t <= hi; t += stp)
      g += `<line x1="${X(t).toFixed(1)}" x2="${X(t).toFixed(1)}" y1="2" y2="${7*RH}" stroke="var(--line)" stroke-width="1"/><text x="${X(t).toFixed(1)}" y="${H-4}" text-anchor="middle" font-family="${FF}" font-size="11" fill="#5F636B">${clock(t).slice(0,2)}</text>`;
    N.forEach((o,i) => {
      const y = i*RH, last = i===6;
      g += `<text x="0" y="${y+16}" font-family="${FF}" font-size="11" font-weight="${last?700:500}" fill="${last?"#111318":"#5F636B"}">${DOW_S[parse(o.ds).getDay()]}</text>`;
      if (o.s==null){ g += `<text x="${X0}" y="${y+16}" font-family="${FF}" font-size="11" fill="#5F636B">veri yok</text>`; return; }
      const col = o.min >= 420 ? "#3B3FE4" : o.min >= 360 ? "#8F92F2" : "#E8590C";
      g += `<rect x="${X(o.s).toFixed(1)}" y="${y+5}" width="${Math.max(4, X(o.e)-X(o.s)).toFixed(1)}" height="14" rx="7" fill="${col}"/>`;
      g += `<text x="320" y="${y+16}" text-anchor="end" font-family="${SG}" font-size="12" font-weight="700" fill="#111318">${hm(o.min)}</text>`;
    });
    const ms = mAvg(K.map(o => o.s)), sd = Math.sqrt(mAvg(K.map(o => (o.s-ms)**2)));
    box.innerHTML = head
      + `<span class="foot">Uykuya dalış ort. <b style="color:var(--ink)">${clock(ms)}</b>${K.length > 2 ? ` · gece gece ±${Math.round(sd)} dk oynuyor` : ""}</span>`
      + `<svg viewBox="0 0 320 ${H}" role="img" aria-label="Son 7 gecenin uyku saatleri">${g}</svg>`
      + `<div class="legend"><span><i style="background:#3B3FE4"></i>7 sa üstü</span><span><i style="background:#8F92F2"></i>6–7 sa</span><span><i style="background:#E8590C"></i>6 sa altı</span></div>`;
  }

  function renderStrength(){
    const box = $("strength"), m = new Map(), dates = new Set();
    [...hist.values()].sort((a,b)=>a.date.localeCompare(b.date)).forEach(d => (d.sessions||[]).forEach(s => {
      if (!isStrength(s.kind)) return;
      (s.ex||[]).forEach(e => {
        if (e.kg==null || !norm(e.name)) return;
        dates.add(d.date);
        const k = norm(e.name); if (!m.has(k)) m.set(k, {name:e.name.trim(), pts:[]});
        const it = m.get(k), kg = Number(e.kg), same = it.pts.find(p => p.date===d.date);
        if (same) same.kg = Math.max(same.kg, kg); else it.pts.push({date:d.date, kg});
      });
    }));
    const head = `<div class="chd"><span class="lbl">Güç · ilk kayıttan bugüne</span><span class="lr">${dates.size ? `${dates.size} ağırlık seansı` : ""}</span></div>`;
    const order = GYM_EX.map(norm);
    const list = [...m.entries()].sort((a,b) => { const ia = order.indexOf(a[0]), ib = order.indexOf(b[0]);
      return (ia<0?99:ia) - (ib<0?99:ib) || a[0].localeCompare(b[0], "tr"); });
    if (!list.length){ box.innerHTML = head + `<span class="mempty">${daysSeen ? "İlk ağırlık kaydından sonra her hareketin gelişimi burada görünür." : "Yükleniyor…"}</span>`; return; }
    box.innerHTML = head + `<div>` + list.map(([k, it]) => {
      const pts = it.pts, first = pts[0].kg, last = pts[pts.length-1].kg, df = last - first;
      const lo = Math.min(...pts.map(p=>p.kg)), hi = Math.max(...pts.map(p=>p.kg)), W = 72, H = 30;
      const X = i => pts.length>1 ? i/(pts.length-1)*W : W/2, Y = v => hi===lo ? H/2 : H - (v-lo)/(hi-lo)*(H-6) - 3;
      const line = pts.map((p,i) => `${X(i).toFixed(1)},${Y(p.kg).toFixed(1)}`).join(" ");
      const svg = `<svg viewBox="0 0 ${W} ${H}" aria-hidden="true">${pts.length>1 ? `<polyline points="${line}" fill="none" stroke="#3B3FE4" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>` : ""}<circle cx="${X(pts.length-1).toFixed(1)}" cy="${Y(last).toFixed(1)}" r="4" fill="#3B3FE4"/></svg>`;
      const chip = pts.length < 2 ? `<span class="dch">ilk</span>` : df>0 ? `<span class="dch up">+${fmt(df)}</span>` : df<0 ? `<span class="dch dn">−${fmt(-df)}</span>` : `<span class="dch">aynı</span>`;
      return `<div class="srow"><div><b>${esc(it.name)}</b><small>${pts.length} seans · ilk ${fmt(first)} kg</small></div>${svg}<div class="sv"><strong class="num">${fmt(last)}<em>kg</em></strong>${chip}</div></div>`;
    }).join("") + `</div>`;
  }

  /* ---------- calendar: what got done each day since the diet started; tap a day to open it ---------- */
  function renderCalendar(){
    const box = $("cal");
    const mon = ds => addDays(ds, -((parse(ds).getDay()+6)%7));
    const anchor = cur > TODAY || cur < addDays(TODAY,-35) ? cur : TODAY;
    const end = addDays(mon(anchor), 6);
    const D0 = DIET_START || addDays(TODAY,-28);
    let start = mon(D0);
    if (start < addDays(end, -41)) start = addDays(mon(end), -35);
    let html = `<div class="cgrid">` + ["Pzt","Sal","Çar","Per","Cum","Cmt","Paz"].map(x => `<span class="dh">${x}</span>`).join("") + `<span class="dh">hafta</span>`;
    let thisWeek = 0;
    for (let w = start; w <= end; w = addDays(w, 7)){
      let n = 0;
      for (let k=0; k<7; k++){
        const ds = addDays(w,k), wd = parse(ds).getDay(), pk = PLAN[wd].kind, dk = doneKinds(ds);
        const main = dk.has("gym") ? "gym" : dk.has("run") ? "run" : dk.has("bike") ? "bike" : dk.has("walk") ? "walk" : null;
        if (main && main!=="walk") n++;
        let cls = "cd";
        if (main) cls += " d-" + main;
        else if (ds >= TODAY && pk!=="rest") cls += " plan k-" + pk;
        else if (ds < TODAY && ds >= D0 && pk!=="rest") cls += " miss";
        if (ds < D0) cls += " pre";
        if (ds===TODAY) cls += " today";
        if (ds===cur) cls += " sel";
        const dd = parse(ds), what = main ? `${KIND_LABEL[main]||main} yapıldı` : ds >= TODAY ? `plan: ${PLAN[wd].title}` : pk==="rest" ? "dinlenme" : `${PLAN[wd].title} yapılmadı`;
        html += `<button class="${cls}" data-date="${ds}" aria-label="${esc(`${dd.getDate()} ${MON[dd.getMonth()]} ${DOW[wd]}, ${what}`)}">${dd.getDate()}</button>`;
      }
      if (w <= TODAY && TODAY <= addDays(w,6)) thisWeek = n;
      html += `<span class="cs${n >= WEEK_TARGET ? " hit" : ""}">${n}/${WEEK_TARGET}</span>`;
    }
    html += `</div>`;
    box.innerHTML = `<div class="chd"><span class="lbl">Antrenman günleri</span><span class="lr">Bu hafta ${thisWeek}/${WEEK_TARGET} · güne gitmek için dokun</span></div>${html}
      <div class="legend"><span><i style="background:var(--gym)"></i>Ağırlık</span><span><i style="background:var(--run)"></i>Koşu</span><span><i style="background:var(--bike)"></i>Bisiklet</span><span><i style="background:var(--rest-soft);box-shadow:inset 0 0 0 1px var(--rest-2)"></i>Yürüyüş</span><span><i class="ol"></i>Plan</span></div>`;
  }

  /* ---------- form state + autosave ---------- */
  function readForm(){

    day.notes = $("notes").value.trim();
  }
  function setSave(state, text){
    const p = $("savePill"); p.className = "savepill " + state; $("saveTxt").textContent = text;
    clearTimeout(setSave.t);
    if (state==="ok") setSave.t = setTimeout(() => { p.className = "savepill idle"; }, 1800);
  }
  function markDirty(){ dirty = true; setSave("saving", "Kaydediliyor…"); clearTimeout(saveT); saveT = setTimeout(save, 900); }

  document.addEventListener("input", e => {
    const t = e.target;

      const s = day.sessions[+t.dataset.s];

  document.addEventListener("click", e => {
    const t = e.target.closest("button");

    if (t.hasAttribute("data-pnow")){ openGuided("card"); return; }
    if (t.dataset.add){ readForm(); day.sessions.push(newSession(t.dataset.add)); const i = day.sessions.length-1; renderSessions(); markDirty();
      requestAnimationFrame(() => { const el = $("sess"+i); if (el) el.scrollIntoView({block: el.classList.contains("gym") ? "start" : "center", behavior:"smooth"}); }); return; }
    if (t.dataset.edit !== undefined){ const i = +t.dataset.edit; if (editing.has(i)) editing.delete(i); else editing.add(i); renderSessions(); return; }
    if (t.dataset.del !== undefined){ readForm(); day.sessions.splice(+t.dataset.del,1); editing.clear(); renderSessions(); markDirty(); return; }
    if (t.dataset.delex){ const [i,j] = t.dataset.delex.split("-").map(Number); readForm(); day.sessions[i].ex.splice(j,1); renderSessions(); markDirty(); return; }
    if (t.dataset.addex !== undefined){ readForm(); const i = +t.dataset.addex; day.sessions[i].ex.push({name:"", kg:"", sets:"", reps:""}); editing.add(i); renderSessions(); markDirty();
      requestAnimationFrame(() => { const el = $(`s${i}-n${day.sessions[i].ex.length-1}`); if (el) el.focus(); }); return; }
    if (t.dataset.btype !== undefined){ day.sessions[+t.dataset.btype].type = t.dataset.v; renderSessions(); markDirty(); return; }
    if (t.dataset.step){
      const m = t.dataset.step.match(/^(\d+)-(\d+)([+-])1$/); if (!m) return;
      const e2 = day.sessions[+m[1]].ex[+m[2]], st = stepFor(e2.name);
      let v = num(e2.kg); if (v==null){ const l = lastFor(e2.name, cur); if (!l && m[3]==="-") return; v = l ? l.kg : 0; }
      v = Math.max(0, Math.round((v + (m[3]==="+" ? st : -st))*100)/100);
      e2.kg = fmt(v); $(`s${m[1]}-kg${m[2]}`).value = e2.kg; fitIn($(`s${m[1]}-kg${m[2]}`)); refreshEx(+m[1], +m[2]); markDirty(); return;
    }

  });
  $("prev").onclick = () => go(addDays(cur,-1));
  $("next").onclick = () => go(addDays(cur,1));
  $("toToday").onclick = () => go(TODAY);

  /* ---------- data ---------- */
  function cleanForSave(date){
    readForm();
    const sessions = day.sessions.map(s => {
      if (isStrength(s.kind)) return {kind:s.kind, ex: s.ex.filter(e => e.name.trim() && String(e.kg).trim()!=="").map(e => ({name:e.name.trim(), kg:num(e.kg), sets:num(e.sets), reps:num(e.reps)}))};
      const o = {kind:s.kind};
      for (const k of ["min","km","hr","calf"]) if (k in s) o[k] = num(s[k]);
      if (s.place) o.place = s.place; if (s.type) o.type = s.type;
      return o;
    });
    return {...day.legacy, date, weight:day.weight, waist:day.waist, notes:day.notes, sessions, updatedAt:new Date().toISOString()};
  }

  async function save(){
    clearTimeout(saveT); saveT = null;
    if (!db){ setSave("bad", "Kayıt kapalı"); return; }
    const date = cur, data = cleanForSave(date);
    lastWrite = data.updatedAt;
    setSave("saving", "Kaydediliyor…");
    const ok = () => { if (cur===date && !saveT){ dirty = false; setSave("ok", "Kaydedildi"); } };
    try{ await db.doc("days/"+date).set(data); ok(); }
    catch(err){
      if (err && err.code==="unavailable"){
        await new Promise(r=>setTimeout(r, 600+Math.random()*600));
        try{ await db.doc("days/"+date).set(data); ok(); } catch(e2){ setSave("bad", "Kaydedilemedi · tekrar dene"); }
      } else if (err && err.code==="quota_exceeded") setSave("bad", "Depo dolu");
      else setSave("bad", "Kaydedilemedi · tekrar dene");
    }
  }

  const KNOWN = ["date","weight","waist","notes","sessions","updatedAt"];
  function loadDayFrom(data){
    if (data){
      const legacy = {}; Object.keys(data).forEach(k => { if (!KNOWN.includes(k)) legacy[k] = data[k]; });
      day = {date:cur, weight:data.weight??null, waist:data.waist??null, notes:data.notes||"", legacy,
        sessions:(data.sessions||[]).map(s => {
          if (isStrength(s.kind)) return {kind:s.kind, ex:(s.ex||[]).map(e=>({name:e.name||"", kg:fmt(e.kg), sets:fmt(e.sets), reps:fmt(e.reps)}))};
          const o = {...s}; for (const k of ["min","km","hr","calf"]) if (k in o) o[k] = o[k]??""; return o;
        })};
    } else day = emptyDay(cur);
    renderForm();
  }

  function go(date){
    if (dirty) save();
    TODAY = iso(new Date());
    cur = date; dirty = false; editing.clear(); setSave("idle", "");
    if (hist.has(date)) loadDayFrom(hist.get(date)); else { day = emptyDay(cur); renderForm(); }
    renderHeader();
    if (db) subscribeDay();
  }

  function subscribeDay(){
    if (unsubDay) unsubDay();
    unsubDay = db.doc("days/"+cur).onSnapshot(snap => {
      if (dirty) return;
      const v = snap.exists ? snap.data() : null;
      if (v && v.updatedAt && v.updatedAt === lastWrite) return; // our own write echoing back
      loadDayFrom(v);
    }, () => {});
  }
  /* ---------- posture alarm ---------- */
  const PT_TARGET = 3, PT_COOL = 2*3600e3, PT_GRACE = 2*60e3, PT_REPS = 8, PT_HOLD = 5, PT_REST = 2, PT_READY = 3;
  const ROUTINE = [
    {k:"chin",  t:"Çene geri çekme",                d:"3 × 10 · her tekrarda 5 sn tut"},
    {k:"pec",   t:"Kapı pervazında göğüs esnetme",  d:"2 × 30 sn"},
    {k:"thor",  t:"Göğüs omurgası açma",            d:"10 tekrar · sandalye arkalığı ya da köpük silindir"},
    {k:"angel", t:"Duvar meleği",                   d:"2 × 10 · kollar duvara değsin"},
    {k:"neck",  t:"Ense esnetme",                   d:"30 sn · çene göğse"}
  ];
  P.warn = '<path d="M12 3.5L2.5 20h19z"/><path d="M12 10v4.5M12 17.2v.3"/>';
  const ptEmpty = date => ({date, rounds:[], lies:[], routine:{}});
  const ptClone = v => ({date:v.date, rounds:[...(v.rounds||[])], lies:[...(v.lies||[])], routine:{...(v.routine||{})}});
  const todayIso = () => iso(new Date());
  const hhmm = ms => { const d = new Date(ms); return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; };
  const pHist = new Map();
  let pt = ptEmpty(todayIso()), pUnsub = null, pReady = false, paOpen = false, guide = null, autoClose = null;
  const pa = $("pa");

  function ptLast(){
    const r = pt.rounds.map(x => Date.parse(x.t)), l = pt.lies.map(x => Date.parse(x));
    return {r: r.length ? Math.max(...r) : 0, l: l.length ? Math.max(...l) : 0};
  }
  // null = stay quiet; "normal" = time for a round; "liar" = last answer was a confessed lie
  function alarmMode(now){
    const {r, l} = ptLast();
    if (l > r) return now - l >= PT_GRACE ? "liar" : null;
    if (pt.rounds.length >= PT_TARGET) return null;
    return (!r || now - r >= PT_COOL) ? "normal" : null;
  }
  async function ptSave(){
    pHist.set(pt.date, ptClone(pt)); renderPosture();
    if (!db) return;
    const data = {...ptClone(pt), updatedAt:new Date().toISOString()};
    try{ await db.doc("posture/"+pt.date).set(data); }
    catch(e){ try{ await new Promise(r=>setTimeout(r,900)); await db.doc("posture/"+pt.date).set(data); }catch(e2){} }
  }
  function subscribePosture(){
    if (pUnsub) pUnsub();
    let first = true;
    const done = () => { if (first){ first = false; pReady = true; maybeAlarm(); } };
    pUnsub = db.doc("posture/"+pt.date).onSnapshot(snap => {
      if (snap.exists){ const v = snap.data(); if (v && v.date===pt.date){ pt = ptClone(v); pHist.set(pt.date, ptClone(pt)); } }
      renderPosture(); done();
    }, done);
  }
  function rollDay(){
    const t = todayIso(); if (pt.date === t) return false;
    pt = pHist.has(t) ? ptClone(pHist.get(t)) : ptEmpty(t);
    if (db){ pReady = false; subscribePosture(); }
    renderPosture(); return !!db;
  }
  function maybeAlarm(){
    if (paOpen || !pReady || document.visibilityState !== "visible") return;
    if (rollDay()) return;
    const m = alarmMode(Date.now());
    if (m) showAlarm(m);
  }
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") maybeAlarm(); });

  function ptStreak(){
    const ok = ds => ((pHist.get(ds)||{}).rounds||[]).length >= PT_TARGET;
    let d = todayIso(), n = 0;
    if (!ok(d)) d = addDays(d,-1);
    while (ok(d)){ n++; d = addDays(d,-1); }
    return n;
  }
  function ptWeek(){
    const t = todayIso(), mon = addDays(t, -((parse(t).getDay()+6)%7));
    let sum = 0; for (let i=0;i<7;i++) sum += Math.min(PT_TARGET, ((pHist.get(addDays(mon,i))||{}).rounds||[]).length);
    return sum;
  }

  function renderPosture(){
    const box = $("pCard"), n = pt.rounds.length, {r, l} = ptLast(), now = Date.now();
    let sub;
    if (l > r) sub = "Yalan söyledin · sayfaya dönünce alarm çalacak";
    else if (n >= PT_TARGET) sub = "Bugünlük tamam · yarın sabah yeni tur";
    else if (!r || now - r >= PT_COOL) sub = "Şimdi zamanı";
    else sub = `Sonraki tur ${hhmm(r + PT_COOL)} sonrası`;
    let slots = "";
    for (let i=0; i<PT_TARGET; i++){ const x = pt.rounds[i];
      slots += `<div class="pslot${x?" on":""}">${x ? ico("check") + hhmm(Date.parse(x.t)) : ["Sabah","Öğle","Akşam"][i]}</div>`; }
    const st = ptStreak(), lies = pt.lies.length;
    box.innerHTML = `<div class="ptop"><div><span class="lbl">Postür${cur!==pt.date ? " · bugün" : ""}</span><span class="big num">${n}<em>/ ${PT_TARGET} tur</em></span><small>${esc(sub)}</small></div>${n < PT_TARGET || l > r ? `<button class="pnow" data-pnow>Şimdi yap · 1 dk</button>` : ""}</div>
      <div class="pslots">${slots}</div>
      <div class="pfoot"><span>Seri <b class="num">${st}</b> gün</span><span>Bu hafta <b class="num">${ptWeek()}</b>/21</span><span${lies ? ' class="lie"' : ""}>Bugün yalan <b class="num">${lies}</b></span></div>`;
  }

  function headSvg(cls){
    return `<svg class="head ${cls}" viewBox="0 0 200 200" aria-hidden="true">
      <line x1="100" y1="6" x2="100" y2="194" stroke="currentColor" stroke-width="3" stroke-dasharray="1 8" stroke-linecap="round" opacity=".75"/>
      <path d="M48 180 Q100 162 152 180" fill="none" stroke="currentColor" stroke-width="11" stroke-linecap="round"/>

        <circle cx="117" cy="69" r="4.5" fill="currentColor"/><path d="M135 74l9 9-9 3" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>

  function openPA(){ paOpen = true; pa.hidden = false; document.documentElement.style.overflow = "hidden"; }
