    requestAnimationFrame(() => { const f = pa.querySelector("button"); if (f) f.focus({preventScroll:true}); }); }
  const buzz = p => { try{ navigator.vibrate && navigator.vibrate(p); }catch(e){} };

  function showAlarm(mode){
    openPA();
    const n = pt.rounds.length, lies = pt.lies.length, liar = mode === "liar";
    let h1, sub;
    if (!liar){ h1 = "Boynunu<br>geri çek"; sub = "Başın büyük ihtimalle şu an öne kaymış. Çeneni düz geriye çek, tepeni tavana uzat. Sadece 1 dakika."; }
    else if (lies < 2){ h1 = "Bu sefer<br>gerçekten"; sub = "Az önce yapmadığını itiraf ettin. Telefonu bırakmana gerek yok, sadece başını geriye yasla. 1 dakika."; }
    else { h1 = `${lies}. yalan.<br>Yeter.`; sub = `Bugün ${lies} kez “sonra” dedin. Keskin bir çene hattı 1 dakikalık işleri ertelemeyen adamın olur. Şimdi.`; }
    paRender(liar ? "red liar" : "red", `
      <span class="badge">${ico("warn")}${liar ? "Yalan tespit edildi" : "Postür alarmı"}</span>
      ${headSvg("loop")}
      <h1>${h1}</h1>
      <p class="sub">${sub}</p>
      <div class="meta"><span>Bugün ${n}/${PT_TARGET}</span>${lies?`<span>Yalan: ${lies}</span>`:""}${ptStreak()?`<span>Seri: ${ptStreak()} gün</span>`:""}</div>
      <div class="acts">
        <button class="btn-main" data-pa="start">Şimdi yap · 1 dk</button>
        <button class="btn-sec" data-pa="claim">Yaptım</button>
      </div>`);
    buzz(liar ? [300,120,300,120,300] : [250,120,250]);
  }

  function showInterrogation(){
    paRender("dark", `
      <span class="badge">${ico("warn")}Kontrol</span>
      <h1>Gerçekten<br>yaptın mı?</h1>
      <p class="sub">8 tekrar, her birinde çeneyi 5 saniye geride tutarak. Yapmadıysan kandırdığın tek kişi aynadaki.</p>
      <div class="acts">
        <button class="hold" data-hold><span class="fill"></span><span class="lbl">Basılı tut · yaptım<small>emin olmak için 1,5 saniye</small></span></button>
        <button class="btn-lie" data-pa="lie">Yalan söylüyorum</button>
      </div>`);
  }

  function showConfession(){
    const lies = pt.lies.length;
    paRender("amber", `
      <span class="badge">İtiraf kaydedildi</span>
      <h1>Dürüstsün.<br>Ama boynun<br>hâlâ önde.</h1>
      <p class="sub">Bugünün yalan sayacı: <b>${lies}</b>. Sayfaya bir dahaki girişinde alarm tekrar çalacak, bu sefer daha sert. Ya da şimdi 1 dakikada bitir.</p>
      <div class="acts">
        <button class="btn-main" data-pa="start">Tamam, şimdi yapıyorum</button>
        <button class="btn-sec" data-pa="close">Sonra hatırlat</button>
      </div>`);
  }

  function showSuccess(how){
    const n = pt.rounds.length, st = ptStreak(), all = n >= PT_TARGET;
    paRender("green", `
      <span class="badge">${how==="guided" ? "Süreyle yapıldı" : "Kaydedildi"}</span>
      <div class="bigcheck">${ico("check")}</div>
      <h1>${all ? "Bugünlük<br>tamam" : "Aferin"}</h1>
      <p class="sub">${all ? `3/3 tur bitti${st?`, seri ${st} gün`:""}. Yarın sabah tekrar görüşürüz.` : `Bugün ${n}/${PT_TARGET}. Sonraki alarm ${hhmm(Date.now()+PT_COOL)} sonrasında, sayfayı açtığında çalar.`}</p>
      <div class="acts"><button class="btn-main" data-pa="close">Kapat</button></div>`);
    buzz(60);
    clearTimeout(autoClose); autoClose = setTimeout(() => { if (paOpen && pa.classList.contains("green")) closePA(); }, 6000);
  }

  function openGuided(origin){
    if (!paOpen) openPA();
    stopGuide();
    paRender("guide", `
      <div class="gbar"><i id="gBar"></i></div>
      <span class="badge" id="gRep">8 tekrar · 5 sn tut</span>
      <div class="gwrap">
        <div class="gring"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="rgba(255,255,255,.16)" stroke-width="9"/><circle id="gArc" cx="60" cy="60" r="52" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-dasharray="0 327"/></svg><div class="gnum" id="gNum">3</div></div>
      </div>
      <h1 id="gCue">Hazır ol</h1>
      <p class="sub" id="gTip"></p>
      ${headSvg("fwd")}
      <div class="acts"><button class="btn-sec" data-pa="stop">Vazgeç</button></div>`);
    const phases = [{k:"ready", d:PT_READY}];
    for (let i=1;i<=PT_REPS;i++){ phases.push({k:"hold", d:PT_HOLD, i}); if (i<PT_REPS) phases.push({k:"rest", d:PT_REST, i}); }
    const total = phases.reduce((a,p)=>a+p.d, 0), C = 2*Math.PI*52, t0 = performance.now();
    let lastKey = "";
    const tick = () => {
      const el = (performance.now() - t0) / 1000;
      if (el >= total){ stopGuide(); pt.rounds.push({t:new Date().toISOString(), how:"guided"}); ptSave(); showSuccess("guided"); return; }
      let acc = 0, ph = phases[0];
      for (const p of phases){ if (el < acc + p.d){ ph = p; break; } acc += p.d; }
      const left = acc + ph.d - el, frac = (el - acc) / ph.d, key = ph.k + (ph.i||0);
      if (key !== lastKey){
        lastKey = key; buzz(ph.k==="hold" ? 90 : 30);
        $("gCue").textContent = ph.k==="ready" ? "Hazır ol" : ph.k==="hold" ? "Çek · tut" : "Bırak";
        $("gTip").textContent = ph.k==="hold" ? "Çeneni düz geriye çek, çift çene yap. Başını eğme; tepeni tavana doğru uzat. Omuzlar aşağıda."
          : ph.k==="rest" ? "Gevşe, nefes al. Sıradaki geliyor."
          : "Dik otur ya da ayakta dur. Omuzlarını geriye ve aşağıya bırak.";
        $("gRep").textContent = ph.k==="ready" ? "8 tekrar · 5 sn tut" : `Tekrar ${ph.i} / ${PT_REPS}`;
        pa.querySelector(".head").classList.toggle("fwd", ph.k !== "hold");
        pa.classList.toggle("holding", ph.k === "hold");
      }
      $("gNum").textContent = Math.max(1, Math.ceil(left - 1e-6));
      $("gArc").setAttribute("stroke-dasharray", `${(frac*C).toFixed(1)} ${C.toFixed(1)}`);
      $("gBar").style.width = `${(el/total*100).toFixed(1)}%`;
    };
    guide = {origin, timer:setInterval(tick, 100)}; tick();
  }
  function stopGuide(){ if (guide){ clearInterval(guide.timer); guide = null; } }

  // hold-to-confirm: 1.6 s press records the round
  let holdT = null;
  const holdStart = btn => { btn.classList.add("on"); clearTimeout(holdT);
    holdT = setTimeout(() => { btn.classList.remove("on"); pt.rounds.push({t:new Date().toISOString(), how:"claimed"}); ptSave(); showSuccess("claimed"); }, 1600); };
  const holdEnd = () => { clearTimeout(holdT); holdT = null; const b = pa.querySelector(".hold"); if (b) b.classList.remove("on"); };
  pa.addEventListener("pointerdown", e => { const b = e.target.closest("[data-hold]"); if (!b) return; e.preventDefault(); try{ b.setPointerCapture(e.pointerId); }catch(_){} holdStart(b); });
  ["pointerup","pointercancel","lostpointercapture"].forEach(ev => pa.addEventListener(ev, holdEnd));
  pa.addEventListener("contextmenu", e => { if (e.target.closest("[data-hold]")) e.preventDefault(); });
  pa.addEventListener("keydown", e => { const b = e.target.closest && e.target.closest("[data-hold]"); if (b && (e.key===" "||e.key==="Enter") && !e.repeat){ e.preventDefault(); holdStart(b); } });
  pa.addEventListener("keyup", e => { if (e.target.closest && e.target.closest("[data-hold]") && (e.key===" "||e.key==="Enter")) holdEnd(); });

  pa.addEventListener("click", e => {
    const b = e.target.closest("[data-pa]"); if (!b) return;
    const a = b.dataset.pa;
    if (a==="start") openGuided(guide ? guide.origin : "alarm");
    else if (a==="claim") showInterrogation();
    else if (a==="lie"){ pt.lies.push(new Date().toISOString()); ptSave(); showConfession(); }
    else if (a==="close") closePA();
    else if (a==="stop"){ const o = guide && guide.origin; stopGuide(); const m = alarmMode(Date.now() + PT_GRACE);
      if (o === "alarm" && m) showAlarm(m); else closePA(); }
  });

  /* ---------- dashboard + body metrics: Fitbit numbers (fitbit/daily, written by the sync) + notes / Bevel (metrics/<date>) ---------- */
  const met = new Map(); let mBase = null, fit = null, fitSeen = false, daysSeen = false;
  const mAvg = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : null;
  const hm = m => m==null ? "—" : `${Math.floor(m/60)}:${String(Math.round(m%60)).padStart(2,"0")}`;
  const mnum = x => x==null || x==="" || isNaN(Number(x)) ? null : Number(x);
  const sgn = x => Math.abs(x) < 0.05 ? "0.0" : (x>0?"+":"−") + Math.abs(x).toFixed(1);
  const trNum = n => Math.round(n).toLocaleString("tr-TR");
  function dashSafe(){ try { renderMetrics(); } catch(e) { /* data not loaded yet */ } }
  function mRows(){
    const all = new Map();
    met.forEach((v,d) => all.set(d, {...v}));
    const fd = fit && fit.days && typeof fit.days === "object" ? fit.days : {};
    Object.keys(fd).forEach(d => {
      if (/^\d{4}-\d{2}-\d{2}$/.test(d) && fd[d] && typeof fd[d] === "object") all.set(d, {...(all.get(d)||{}), ...fd[d], date:d, src:"Fitbit"});
    });
    return [...all.values()].sort((a,b)=>b.date.localeCompare(a.date));
  }
  function mBaseline(rows){
    // own 30-day normal (mean ± 1 sd) once there are 7+ days; the stored Bevel range is only the fallback
    const t = todayIso(), last30 = rows.filter(v => v.date > addDays(t,-30));
    const calc = k => { const xs = last30.map(v=>mnum(v[k])).filter(x=>x!=null); if (xs.length < 7) return null;
      const m = mAvg(xs), sd = Math.sqrt(mAvg(xs.map(x=>(x-m)**2))); return {avg:m, lo:m-sd, hi:m+sd}; };
    const b = mBase || {};
    const stored = (a,l,h) => b[a]!=null ? {avg:b[a], lo:b[l], hi:b[h]} : null;
    return { hrv: calc("hrv") || stored("hrvAvg","hrvLo","hrvHi"), rhr: calc("rhr") || stored("rhrAvg","rhrLo","rhrHi") };
  }

  // Illness watch: two of three night signals, or a clear temperature jump on its own.
  function riskOf(v, B){
    const sig = [];
    if (!v) return {risk:false, sig};
    const t = mnum(v.tempDelta), r = mnum(v.rhr), h = mnum(v.hrv);
    if (t!=null && t >= 0.5) sig.push(`Isı ${sgn(t)}°`);
    if (r!=null && B.rhr && r > B.rhr.hi) sig.push(`Uyku nabzı ${Math.round(r)}`);
    if (h!=null && B.hrv && h < B.hrv.lo) sig.push(`HRV ${h.toFixed(1)}`);
    return {risk: sig.length >= 2 || (t!=null && t >= 1), sig};
  }

  const FACE_OK = `<svg viewBox="0 0 56 56" aria-hidden="true"><circle cx="28" cy="28" r="26" fill="var(--lime)"/><circle cx="20" cy="23" r="3" fill="#111318"/><circle cx="36" cy="23" r="3" fill="#111318"/><path d="M17 32 Q28 43 39 32" fill="none" stroke="#111318" stroke-width="3" stroke-linecap="round"/></svg>`;
  const FACE_RISK = `<svg viewBox="0 0 56 56" aria-hidden="true"><circle cx="28" cy="28" r="26" fill="#FFB49C"/><path d="M16 22 L24 24" fill="none" stroke="#4A1B0C" stroke-width="3" stroke-linecap="round"/><path d="M40 22 L32 24" fill="none" stroke="#4A1B0C" stroke-width="3" stroke-linecap="round"/><path d="M18 37 Q23 33 28 37 Q33 41 38 37" fill="none" stroke="#4A1B0C" stroke-width="3" stroke-linecap="round"/><path d="M44 10 Q47 15 44 18 Q41 15 44 10 Z" fill="#4A1B0C"/></svg>`;
  const FACE_WAIT = `<svg viewBox="0 0 56 56" aria-hidden="true"><circle cx="28" cy="28" r="26" fill="#E6E5DF"/><circle cx="20" cy="24" r="3" fill="#5F636B"/><circle cx="36" cy="24" r="3" fill="#5F636B"/><path d="M19 35 L37 35" fill="none" stroke="#5F636B" stroke-width="3" stroke-linecap="round"/></svg>`;

  function renderDash(rows, B){
    const byDate = new Map(rows.map(v => [v.date, v]));
    const v = rows.find(x => x.date <= cur && (mnum(x.hrv)!=null || mnum(x.sleepMin)!=null)) || null;
    const fresh = v && v.date === cur;
    const R = riskOf(fresh ? v : null, B);

    let up = "";
    if (fit && fit.updated){ const u = new Date(fit.updated); if (!isNaN(u)) up = ` · Fitbit ${String(u.getHours()).padStart(2,"0")}:${String(u.getMinutes()).padStart(2,"0")}`; }
    $("fitTime").textContent = cur===TODAY ? up : "";
    // today speaks in the present; other days get a neutral title
    $("headline").textContent = cur > TODAY ? "Plan." : cur < TODAY ? "Günün özeti." : !fitSeen ? "Günaydın." : !fresh ? "Günaydın." : R.risk ? "Yavaşla bugün." : "Hazırsın.";
    $("face").innerHTML = !fresh ? FACE_WAIT : R.risk ? FACE_RISK : FACE_OK;
    $("face").setAttribute("aria-label", !fresh ? "Veri bekleniyor" : R.risk ? "Halsiz yüz: hastalık riski" : "Gülümseyen yüz: her şey yolunda");

    // hero
    const hero = $("hero");
    if (!v){
      hero.className = "hero wait";
      hero.innerHTML = `<div><span class="hk">Toparlanma</span><span class="hs">${!fitSeen ? "Fitbit verisi yükleniyor…" : cur > TODAY ? "Bu gün henüz gelmedi." : "Bu gün için Fitbit verisi yok."}</span></div>`;
    } else if (R.risk){
      hero.className = "hero risk";
      hero.innerHTML = `<div><span class="hk">Hey, dikkat</span><h3>Birkaç güne hastalanabilirsin</h3></div>
        <div class="chips">${R.sig.map(x => `<span class="chip">${esc(x)}</span>`).join("")}</div>
        <span class="hs">Bugün ağırlığı ertele: hafif yürüyüş, bol su, erken yat.</span>`;
    } else {
      const h = mnum(v.hrv), r = mnum(v.rhr);
      hero.className = "hero";
      if (h==null){
        hero.innerHTML = `<div><span class="hk">Toparlanma</span><span class="hs">Bu gece için HRV yok.</span></div>`;
      } else {
        const hb = B.hrv;
        const diff = !hb ? "normal henüz yok" : h > hb.hi ? `normalinin ${(h-hb.avg).toFixed(1)} ms üstü` : h < hb.lo ? `normalinin ${(hb.avg-h).toFixed(1)} ms altı` : "normal aralıkta";
        let bar = "";
        if (hb){
          const mn = Math.min(hb.lo-6, h-3), mx = Math.max(hb.hi+6, h+3), X = x => ((x-mn)/(mx-mn)*318).toFixed(1);
          bar = `<svg class="rg" viewBox="0 0 318 18" role="img" aria-label="HRV ${h}, normal aralık ${hb.lo.toFixed(1)}–${hb.hi.toFixed(1)}"><rect x="0" y="7" width="318" height="4" rx="2" fill="#111318" fill-opacity=".15"/><rect x="${X(hb.lo)}" y="5" width="${(X(hb.hi)-X(hb.lo)).toFixed(1)}" height="8" rx="4" fill="#111318" fill-opacity=".35"/><circle cx="${X(h)}" cy="9" r="7" fill="#111318"/></svg>`;
        }
        const rb = B.rhr, rTxt = r==null ? "" : !rb ? `Uyku nabzı ${Math.round(r)}` : `Uyku nabzı ${Math.round(r)} · ${r < rb.lo ? "normalin altında" : r > rb.hi ? "normalin üstünde" : "normal"}`;
        hero.innerHTML = `<div class="hero-top"><div><span class="hk">Toparlanma${fresh ? "" : " · " + esc(shortDate(v.date))}</span><span class="hs">HRV · ${diff}</span></div><div class="hv"><b class="num">${h.toFixed(1)}</b><span>ms</span></div></div>
          <div>${bar}<div class="hf">${hb ? `<span>Normal ${hb.lo.toFixed(1)}–${hb.hi.toFixed(1)}</span>` : "<span></span>"}<span>${esc(rTxt)}</span></div></div>`;
      }
    }

    // diet journey: a runner on the road from the start weight to the goal
    const wCur = cur && day && day.date===cur && day.weight!=null ? Number(day.weight) : null;
    const wPrev = weights().filter(p => p.date <= cur);
    const w = wCur!=null ? wCur : (wPrev.length ? Number(wPrev[wPrev.length-1].weight) : null);
    if (!cfgSeen){ $("journey").innerHTML = `<div class="jtop"><div><b class="k">Kilo yolculuğu</b><small>Yükleniyor…</small></div></div>`; }
    else {
    const dn = DIET_START ? daysBetween(DIET_START, cur) + 1 : null;
    const span = START_W - GOAL, p = w==null ? 0 : Math.max(0, Math.min(1, (START_W - w) / span));
    const T0 = 8, TL = 310, px = T0 + p*TL, mpx = T0 + (START_W-MILESTONE)/span*TL;
    $("journey").innerHTML = `<div class="jtop"><div><b class="k">${dn==null ? "Kilo yolculuğu" : dn>0 ? `Diyetin ${dn}. günü` : "Diyet başlamadı"}</b><small>${w==null ? (daysSeen ? "İlk kiloyu gir" : "Yükleniyor…") : `${fmt(START_W-w)} kg gitti · ${dat(GOAL)} ${fmt(Math.max(0,w-GOAL))} kaldı`}</small></div>${w==null ? "" : `<span class="w num">${fmt(w)}<em>kg</em></span>`}</div>
      <svg viewBox="0 0 326 60" role="img" aria-label="Kilo yolculuğu: ${START_W} kilodan ${GOAL} kiloya giden yolun yüzde ${Math.round(p*100)}'indesin">
        <line x1="${T0}" y1="36" x2="${T0+TL}" y2="36" stroke="#C9CBD1" stroke-width="4" stroke-linecap="round" stroke-dasharray="1 8"/>
        ${p > 0.01 ? `<line x1="${T0}" y1="36" x2="${px.toFixed(1)}" y2="36" stroke="var(--data)" stroke-width="8" stroke-linecap="round"/>` : ""}
        <circle cx="${mpx.toFixed(1)}" cy="36" r="5" fill="${w!=null && w<=MILESTONE ? "var(--data)" : "#FFFFFF"}" stroke="#111318" stroke-width="2"/>
        <line x1="316" y1="14" x2="316" y2="40" stroke="#111318" stroke-width="2" stroke-linecap="round"/><path d="M316 14 L304 18.5 L316 23 Z" fill="#111318"/>
        <g transform="translate(${(px-14).toFixed(1)} 3)" fill="none" stroke="#111318" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="17" cy="4" r="3.2" fill="#111318" stroke="none"/><path d="M15 9 L12 18"/><path d="M8 11 L14 10 L19 14"/><path d="M12 18 L18 22 L17 28"/><path d="M12 18 L8 23 L3 23"/></g>
        <text x="${T0}" y="56" font-family="Inter, sans-serif" font-size="11" fill="#5F636B">${START_W}${DIET_START ? " · " + esc(shortDate(DIET_START)) : ""}</text>
        <text x="${mpx.toFixed(1)}" y="56" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#5F636B">${MILESTONE}</text>
        <text x="318" y="56" text-anchor="end" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#111318">${GOAL}</text>
      </svg>`;
    }

    // sleep (night ending on this day) and steps (the day before)
    const sv = fresh ? v : null, sm = sv ? mnum(sv.sleepMin) : null;
    const de = sv ? mnum(sv.deepMin) : null, re = sv ? mnum(sv.remMin) : null, li = sv ? mnum(sv.lightMin) : null;
    $("sleepCard").innerHTML = `<span class="k">Uyku</span><span class="big num">${sm==null ? "—" : `${hm(sm)}<em>sa</em>`}</span>
      <div style="display:flex;flex-direction:column;gap:6px">${de!=null && re!=null ? `<div class="stg"><i style="flex:${de};background:var(--data)"></i><i style="flex:${re};background:var(--data-2)"></i><i style="flex:${li!=null ? li : Math.max(0,(sm||0)-de-re)};background:var(--data-3)"></i></div><span class="sub">Derin ${hm(de)} · REM ${hm(re)}</span>` : `<span class="sub">${!fitSeen ? "Yükleniyor…" : sm==null ? "Bu gece için veri yok" : "Evre verisi yok"}</span>`}</div>`;
    // the selected day's own steps; today's count runs up to the last Fitbit sync
    const sd = byDate.get(cur), st = cur > TODAY || !sd ? null : mnum(sd.steps);
    const yd = byDate.get(addDays(cur,-1)), ys = yd ? mnum(yd.steps) : null;
    const st7 = mAvg([...Array(7)].map((_,i) => byDate.get(addDays(cur,-1-i))).filter(Boolean).map(x => mnum(x.steps)).filter(x => x!=null));
    let stSub;
    if (cur > TODAY) stSub = "Bu gün henüz gelmedi";
    else if (cur===TODAY) stSub = [up ? `${up.replace(" · Fitbit ", "")} itibarıyla` : "", ys!=null ? `dün ${trNum(ys)}` : ""].filter(Boolean).join(" · ") || "Hedef 10 bin";
    else stSub = `Hedef 10 bin${st7==null ? "" : ` · 7 gün ort. ${trNum(st7)}`}`;
    $("stepsCard").innerHTML = `<span class="k">Adım${cur===TODAY ? " · bugün" : ""}</span><span class="big num">${st==null ? "—" : trNum(st)}</span>
      <div style="display:flex;flex-direction:column;gap:6px"><div class="pbar"><i style="width:${st==null ? 0 : Math.min(100, st/100).toFixed(1)}%"></i></div><span class="sub">${stSub}</span></div>`;

    // HRV, last 7 nights up to this day
    const hv = [...Array(7)].map((_,i) => { const x = byDate.get(addDays(cur, i-6)); return x ? mnum(x.hrv) : null; });
    const known = hv.filter(x => x!=null);
    let svg = "", note = fitSeen ? "Veri yok" : "Yükleniyor…";
    if (known.length){
      const hb = B.hrv, mn = Math.min(20, ...known.map(x=>x-2), hb ? hb.lo-2 : 99), mx = Math.max(40, ...known.map(x=>x+2), hb ? hb.hi+2 : 0);
      const Y = x => 56 - (x-mn)/(mx-mn)*52;
      if (hb) svg += `<rect x="0" y="${Y(hb.hi).toFixed(1)}" width="168" height="${(Y(hb.lo)-Y(hb.hi)).toFixed(1)}" fill="#ECECF6"/>`;
      hv.forEach((x,i) => { if (x==null) return; const y = Y(x), last = i===6, low = hb && x < hb.lo;
        svg += `<rect x="${4+i*24}" y="${y.toFixed(1)}" width="16" height="${(56-y).toFixed(1)}" rx="4" fill="${low ? "#E8590C" : last ? "var(--data)" : "#C8C9F4"}"/>`; });
      const lastV = hv[6], mxV = Math.max(...known);
      note = lastV==null ? "Bu gecenin verisi yok" : lastV===mxV && known.length > 2 ? "Bu sabah haftanın zirvesi" : hb && lastV < hb.lo ? "Normalin altında" : "Haftalık seyir";
    }
    $("hrvWeek").innerHTML = `<div><b>HRV · 7 gün</b><small>${esc(note)}</small></div><svg viewBox="0 0 168 56" role="img" aria-label="Son 7 gecenin HRV değerleri">${svg}</svg>`;
  }

  /* ---------- findings: computed by the pipeline (fitbit/daily.insights), only displayed here ---------- */
  const FX = {
    bedtime:  f => ["Geç yatış", `${f.cut} sonrası yatılan geceler`],
    sleep:    f => ["Uzun uyku", `${hm(mnum(f.cut))} saatten uzun uyunan geceler`],
    steps:    f => ["Önceki gün çok adım", `${trNum(mnum(f.cut) || 0)} adımın üstü`],
    training: f => ["Önceki gün antrenman", "yürüyüş hariç, 15 dk üstü"],
    shift:    f => ["Düzensiz yatış", `alışılmış saatten ${Math.round(mnum(f.cut) || 0)} dk'dan fazla sapma`]
  };
  const VERD = {clear:["up","net"], likely:["mid","olası"], unclear:["","belirsiz"]};
  function renderFindings(){
    const box = $("findings"), ins = fit && fit.insights && typeof fit.insights==="object" ? fit.insights : null;
    const head = r => `<div class="chd"><span class="lbl">Bulgular · HRV'ni ne oynatıyor</span><span class="lr">${r||""}</span></div>`;
    if (!ins){ box.innerHTML = head() + `<span class="mempty">${fitSeen ? "Bulgular bir sonraki Fitbit güncellemesiyle gelir." : "Yükleniyor…"}</span>`; return; }
    const all = (Array.isArray(ins.drivers) ? ins.drivers : []).filter(f => f && FX[f.x] && mnum(f.effect)!=null && VERD[f.verdict]);
    const list = all.filter(f => f.y==="hrv" || f.verdict!=="unclear");
    const nights = mnum(ins.nights);
    let html = head(nights!=null ? `${nights} gece` : "");
    if (!list.length) html += `<span class="mempty">Test için hareket başına en az 20 gece lazım. Veri biriktikçe burası dolar.</span>`;
    else {
      const sure = list.filter(f => f.verdict==="clear"), maybe = list.filter(f => f.verdict==="likely");
      const say = f => `${FX[f.x](f)[0].toLocaleLowerCase("tr-TR")} (${f.y==="hrv" ? "HRV" : "uyku nabzı"} ${sgn(f.effect)} ${f.y==="hrv" ? "ms" : "bpm"})`;
      let h, lead;
      if (sure.length){ h = "Net bir örüntü var."; lead = `Tesadüf olma ihtimali düşük: <b>${esc(sure.map(say).join(", "))}</b>.`; }
      else if (maybe.length){ h = "Bir şey beliriyor."; lead = `Henüz kesin değil ama işaret var: <b>${esc(maybe.map(say).join(", "))}</b>.`; }
      else {
        h = "Henüz kanıtlanmış bir şey yok.";
        const c = list.filter(f => f.y==="hrv" && mnum(f.needN)!=null).sort((a,b) => mnum(a.p) - mnum(b.p))[0];
        lead = c ? `En güçlü aday <b>${esc(say(c))}</b>, ama bu kadar fark ${mnum(c.n)} gecede tesadüfen de çıkar. Gerçekse yaklaşık <b>${mnum(c.needN)} gecede</b> netleşir.`
                 : "Şimdiye kadarki farkların hepsi tesadüfle açıklanabilir.";
      }
      html += `<h3>${h}</h3><span class="lead">${lead}</span>`;
      const mx = Math.max(...list.map(f => Math.abs(f.effect)), 1);
      html += `<div>` + list.map(f => { const [t, sub] = FX[f.x](f), [vc, vt] = VERD[f.verdict], w = Math.abs(f.effect)/mx*50, hrv = f.y==="hrv";
        return `<div class="frow"><div><b>${esc(t)}${hrv ? "" : " · uyku nabzı"}</b><small>${esc(sub)} · ${mnum(f.nHi)} / ${mnum(f.nLo)} gece</small></div>
          <div class="fr"><strong class="num">${sgn(f.effect)}<em>${hrv ? "ms" : "bpm"}</em></strong><span class="dch ${vc}">${vt}</span></div>
          <div class="fbar" aria-hidden="true"><i class="${f.verdict==="unclear" ? "" : "s"}" style="${f.effect < 0 ? `right:50%;width:${w.toFixed(1)}%` : `left:50%;width:${w.toFixed(1)}%`}"></i></div></div>`; }).join("") + `</div>`;
    }
    const a = ins.alerts && typeof ins.alerts==="object" ? ins.alerts : null, fl = a && Array.isArray(a.flagged) ? a.flagged.filter(x => x && /^\d{4}-\d{2}-\d{2}$/.test(x.date)) : [];
    if (a && mnum(a.nights)){
      const when = fl.slice(-5).map(x => shortDate(x.date)).join(", ");
      html += `<div class="falert"><b>Hastalık uyarısı geçmişte kaç kez çalardı?</b><br>${mnum(a.nights)} gecede ${fl.length ? `<b>${fl.length} kez</b>: ${fl.length > 5 ? "son beşi " : ""}${esc(when)}.` : "hiç çalmadı."}</div>`;
    }
    html += `<span class="foot">Gözlem verisi: birlikte görülmeyi gösterir, neden-sonucu kanıtlamaz. On soru birden sorulduğu için "net" demenin eşiği sıkı. Her güncellemede yeniden hesaplanır.</span>`;
    box.innerHTML = html;
  }

  function renderMetrics(){
    const rows = mRows(), B = mBaseline(rows);
    renderDash(rows, B);
    renderSleepWeek();
    renderFindings();
    renderHow(B);
  }

  function renderHow(B){
    let up = "henüz yok";
    if (fit && fit.updated){ const u = new Date(fit.updated); if (!isNaN(u)) up = `${shortDate(iso(u))} ${hhmm(u.getTime())}`; }
    const items = [
      `Fitbit verisi kendiliğinden gelir: her gün 07:40'tan 22:40'a kadar 3 saatte bir. Son güncelleme ${up}. Bugünün adımı o saate kadar sayılır.`,
      B.hrv && B.rhr ? `Senin normalin, son 30 günün ortalaması ± 1 sapma: HRV ${B.hrv.lo.toFixed(1)}–${B.hrv.hi.toFixed(1)} ms, uyku nabzı ${B.rhr.lo.toFixed(1)}–${B.rhr.hi.toFixed(1)} bpm.` : "Normal aralık için en az 7 günlük veri lazım.",
      "Hastalık uyarısı: aynı gece cilt ısısı +0.5° üstü, uyku nabzı normalin üstü, HRV normalin altı. Bunlardan ikisi bir aradaysa ya da ısı tek başına +1°'yi geçerse yüz değişir.",
      "Hareket kartı: Fitbit'in tanıdığı antrenmanlar kendiliğinden düşer. 15 dakikayı geçen kardiyo, kardiyo gününü tamamlar. Kaçırdığını elle ekleyebilirsin.",
      "Kilo trendi: son 3 haftanın tartılarına çizilen doğru. 1 kg yağ ≈ 7.700 kcal sayılır; açık tahmini buradan gelir. Su yüzünden günlük ±0.5 kg oynama normal.",
      "Yediğin kcal tahmini: Fitbit'in aynı günlerde yaktığını söylediği ortalamadan bu açık çıkarılır. Bileklikler harcamayı çoğu zaman fazla yazar; saydığın rakam belirgin düşükse fark oradan gelir.",
      "Bulgular: her gecenin HRV'si önceki 14 gecenin ortancasına göre ölçülür, böylece formunun yavaş yavaş artması sonucu bozmaz. Alışkanlıkla ilişki sıra korelasyonu ve 10.000 karıştırmalı permütasyon testiyle sınanır; on test birlikte düzeltilir. Fark, yüksek yarı ile düşük yarının ortalaması arasındadır.",
      "Kilo, bel, not ve antrenmanlar sen yazdıkça kendiliğinden kaydolur."
    ];
    $("howBody").innerHTML = items.map(x => `<li>${esc(x)}</li>`).join("");
  }

  setSave("idle", "");
  renderHeader(); renderForm(); renderTrend(); renderStrength(); renderPosture(); renderMetrics();

  (async () => {
    try{ db = window.claude && window.claude.use ? await window.claude.use("db") : null; }catch(e){ db = null; }
    if (!db){
      const b = $("dbBanner"); b.hidden = false;
      b.textContent = "Kayıt şu an kullanılamıyor. Plan görünüyor ama girdiklerin kaydedilmez. Sayfayı Claude hesabın açıkken aç.";
      daysSeen = true; fitSeen = true; cfgSeen = true;
      renderTrend(); renderStrength(); renderSessions();
      pReady = true; maybeAlarm();
      return;
    }
    const cfgDone = v => { applyConfig(v); renderTrend(); renderStrength(); safeRenderSessions(); };
    db.doc("meta/config").onSnapshot(snap => cfgDone(snap.exists ? snap.data() : null), () => cfgDone(null));
    subscribeDay();
    subscribePosture();
    db.collection("posture").orderBy("date","desc").limit(90).onSnapshot(qs => {
      pHist.clear();
      qs.docs.forEach(d => { const v = d.data(); if (v && v.date) pHist.set(v.date, ptClone(v)); });
      pHist.set(pt.date, ptClone(pt));
      renderPosture();
    }, () => {});
    db.collection("metrics").orderBy("date","desc").limit(60).onSnapshot(qs => {
      met.clear(); qs.docs.forEach(d => { const v = d.data(); if (v && v.date) met.set(v.date, v); }); renderMetrics();
    }, () => {});
    db.doc("meta/baseline").onSnapshot(snap => { mBase = snap.exists ? snap.data() : null; renderMetrics(); }, () => {});
    db.doc("fitbit/daily").onSnapshot(snap => { fit = snap.exists ? snap.data() : null; fitSeen = true; safeRenderSessions(); renderTrend(); }, () => { fitSeen = true; safeRenderSessions(); });
    db.collection("days").orderBy("date","desc").limit(150).onSnapshot(qs => {
      daysSeen = true;
      hist.clear();
      qs.docs.forEach(d => { const v = d.data(); if (v && v.date) hist.set(v.date, v); });
      renderTrend(); renderStrength();
      if (!dirty){ renderTiles(); safeRenderSessions(); } else renderHeader();
    }, () => { daysSeen = true; renderTrend(); renderStrength(); });
  })();
})();
</script>
</body>
</html>
