[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "health-pipeline"
version = "0.4.1"
description = "Incremental ETL: Fitbit data via the Google Health API (or Apple Health via an iOS Shortcut) -> tidy daily CSVs, scheduled on GitHub Actions."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "nonentertainer"}]
dependencies = []

[project.optional-dependencies]
drive = ["google-api-python-client>=2.100", "google-auth>=2.23"]
dev = ["pytest>=8"]

[project.scripts]
health-pipeline = "health_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
