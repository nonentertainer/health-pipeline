# Copy to .github/workflows/sync.yml in your PRIVATE data repository.
# Needs one secret: GOOGLE_HEALTH_CREDS = {"client_id": "...", "client_secret": "...", "refresh_token": "..."}
name: sync

on:
  schedule:                 # GitHub cron is UTC; these are 08:15, 13:15 and 23:45 in Istanbul (UTC+3)
    - cron: "15 5 * * *"
    - cron: "15 10 * * *"
    - cron: "45 20 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: Days to fetch (raise for a backfill, e.g. 90)
        default: "7"

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "health-pipeline @ git+https://github.com/nonentertainer/health-pipeline@v0.4.1"

      - name: Sync from Google Health API
        env:
          GOOGLE_HEALTH_CREDS: ${{ secrets.GOOGLE_HEALTH_CREDS }}
          DAYS: ${{ inputs.days || '7' }}
        run: health-pipeline sync --google --google-days "$DAYS" --data-dir data --state state/sync_state.json

      - name: Commit
        run: |
          git config user.name "health-pipeline[bot]"
          git config user.email "health-pipeline@users.noreply.github.com"
          git add data state
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "sync ${{ github.event_name }} $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
