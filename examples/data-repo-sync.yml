# Copy to .github/workflows/sync.yml in your PRIVATE data repository.
# Secrets needed there: GDRIVE_SA_KEY (service account JSON), GDRIVE_FOLDER_ID.
name: sync

on:
  schedule:
    - cron: "15 5 * * *"    # 08:15 Europe/Istanbul
    - cron: "15 10 * * *"   # 13:15, picks up late sleep/HRV revisions
  workflow_dispatch:
    inputs:
      full:
        description: Re-process every file (ignores sync state)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "health-pipeline[drive] @ git+https://github.com/nonentertainer/health-pipeline@v0.1.0"
      - name: Sync
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: health-pipeline sync --data-dir data --state state/sync_state.json --inbox inbox ${{ inputs.full && '--full' || '' }}
      - name: Commit
        run: |
          git config user.name "health-pipeline[bot]"
          git config user.email "health-pipeline@users.noreply.github.com"
          git add data state
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "sync $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
